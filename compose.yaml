name: portfolio-demo

services:
  portfolio-api:
    build:
      context: .
      args:
        SERVICE: portfolio-api
    environment:
      PORT: "8080"
      CORE_API_BASE_URL: http://core-api:8081
      MARKET_API_BASE_URL: http://market-api:8082
      REQUEST_TIMEOUT: 2s
      LOG_FILE: /var/log/app/portfolio-api.jsonl
      OTEL_SERVICE_NAME: portfolio-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8080:8080"
    volumes:
      - ./.local/logs:/var/log/app
    depends_on:
      - core-api
      - market-api
      - otel-collector
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  core-api:
    build:
      context: .
      args:
        SERVICE: core-mock
    environment:
      PORT: "8081"
      CORE_CONTRACT_VERSION: ${CORE_CONTRACT_VERSION:-v1}
      LOG_FILE: /var/log/app/core-api.jsonl
    volumes:
      - ./.local/logs:/var/log/app
    read_only: true
    security_opt:
      - no-new-privileges:true

  market-api:
    build:
      context: .
      args:
        SERVICE: market-mock
    environment:
      PORT: "8082"
      LOG_FILE: /var/log/app/market-api.jsonl
    volumes:
      - ./.local/logs:/var/log/app
    read_only: true
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/prometheus-alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      - portfolio-api

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
