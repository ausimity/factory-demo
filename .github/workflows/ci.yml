name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run complete quality gate
        run: make validate
      - name: Summarize slowest tests
        if: always() && hashFiles('artifacts/test-results.json') != ''
        run: |
          echo '## Slowest tests' >> "$GITHUB_STEP_SUMMARY"
          go tool gotestsum tool slowest --jsonfile artifacts/test-results.json --num 10 >> "$GITHUB_STEP_SUMMARY"
      - name: Retain test timing and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/junit.xml
            artifacts/test-results.json
            artifacts/coverage.out
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan source and dependencies
        run: make security
      - name: Retain readable security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            artifacts/gosec.txt
            artifacts/govulncheck.txt
          if-no-files-found: error
          retention-days: 30
