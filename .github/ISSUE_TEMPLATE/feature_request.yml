name: Feature request
description: Propose a customer-facing capability
title: "[Feature]: "
labels: ["enhancement", "needs-refinement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Customer problem
      description: Describe the outcome, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
  - type: textarea
    id: measurement
    attributes:
      label: Success measurement
      description: Name the metric or observable signal that proves value.
    validations:
      required: true
